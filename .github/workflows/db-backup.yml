name: Backup de la base de datos

# Copia de seguridad diaria de la base de datos de producción, mientras el
# proyecto de Supabase está en el plan Free (que no incluye backups
# automáticos). Es una solución gratuita de transición: en cuanto el
# proyecto pase al plan Pro de Supabase, sus backups gestionados la hacen
# innecesaria y este workflow se puede desactivar.
on:
  schedule:
    - cron: "0 3 * * *" # todos los días a las 3:00 UTC
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña "Actions"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # El cliente que trae Ubuntu por defecto (16) es más antiguo que la
      # versión de Postgres de Supabase (17) — pg_dump no puede volcar un
      # servidor más nuevo que él mismo. Usamos el repositorio oficial de
      # PostgreSQL para instalar la 17.
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Volcar la base de datos
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Falta el secreto SUPABASE_DIRECT_URL en la configuración del repositorio." >&2
            exit 1
          fi
          FILENAME="backup-$(date -u +%Y-%m-%d).sql.gz"
          # El runner ya trae un pg_dump 16 preinstalado en /usr/bin, que no
          # cede el paso al 17 recién instalado — llamamos al binario
          # correcto por su ruta completa para no depender del PATH.
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" | gzip > "$FILENAME"
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"

      - name: Subir la copia como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.FILENAME }}
          retention-days: 30
